name: Cross-border Tailscale qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-border-qualification
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_TS_IP: ${{ secrets.TARGET_TS_IP }}
      PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify overseas runner and required inputs
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          test -n "$AUTHKEY" && test -n "$TARGET_TS_IP" && test -n "$PROBE_TOKEN"
          python3 - <<'PY'
          import urllib.request,json,re
          with urllib.request.urlopen('https://www.cloudflare.com/cdn-cgi/trace',timeout=15) as r:
              text=r.read(8192).decode()
          country=re.search(r'^loc=([A-Z]{2})$',text,re.M)
          assert country and country[1]!='CN','Runner country not verified outside mainland China'
          print(json.dumps({'runner_country':country[1],'outside_mainland_china':True}))
          PY
      - name: Join as a temporary Tailscale device
        id: join
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 https://pkgs.tailscale.com/stable/tailscale_1.104.4_amd64.tgz -o "$RUNNER_TEMP/tailscale.tgz"
          curl --fail --silent --show-error --max-time 15 https://pkgs.tailscale.com/stable/tailscale_1.104.4_amd64.tgz.sha256 -o "$RUNNER_TEMP/tailscale.sha256"
          expected="$(awk '{print $1}' "$RUNNER_TEMP/tailscale.sha256")"
          echo "$expected  $RUNNER_TEMP/tailscale.tgz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/tailscale.tgz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/tailscale_1.104.4_amd64/tailscale" /usr/local/bin/tailscale
          sudo install -m 755 "$RUNNER_TEMP/tailscale_1.104.4_amd64/tailscaled" /usr/local/bin/tailscaled
          sudo /usr/local/bin/tailscaled --state=mem: > "$RUNNER_TEMP/tailscaled.log" 2>&1 &
          sleep 2
          python3 - <<'PYAUTH'
          import os,re,subprocess,json
          key=os.environ['AUTHKEY']
          assert re.fullmatch(r'tskey-auth-[A-Za-z0-9_-]+',key),'Secret must contain a Tailscale Auth key, not an API key'
          code=None;text=''
          try:
              r=subprocess.run(['sudo','/usr/local/bin/tailscale','up','--auth-key='+key,'--hostname=crossborder-'+os.environ['GITHUB_RUN_ID'],'--accept-dns=false','--accept-routes=false','--timeout=15s'],capture_output=True,text=True,timeout=70)
              code=r.returncode;text=r.stdout+r.stderr
          except subprocess.TimeoutExpired:pass
          try:
              q=subprocess.run(['sudo','/usr/local/bin/tailscale','status','--json'],capture_output=True,text=True,timeout=5)
              state=json.loads(q.stdout)
          except Exception:state={}
          if state.get('BackendState')=='NeedsMachineAuth':
              print('Temporary device awaits approval in the Tailscale Machines page',flush=True)
              import time
              end=time.monotonic()+240
              while time.monotonic()<end:
                  time.sleep(3)
                  q=subprocess.run(['sudo','/usr/local/bin/tailscale','status','--json'],capture_output=True,text=True,timeout=5)
                  state=json.loads(q.stdout)
                  if state.get('BackendState')=='Running':code=0;break
          low=text.lower()
          print(json.dumps({'enrollment_exit':code,'backend_state':state.get('BackendState'),'online':state.get('Self',{}).get('Online'),'health_count':len(state.get('Health') or []),'invalid_key_reported':'invalid key' in low or 'invalid auth' in low,'approval_mentioned':'approv' in low,'login_url_present':'https://login.tailscale.com/' in text}))
          assert code==0 and state.get('BackendState')=='Running','Enrollment did not complete; see sanitized state above'
          PYAUTH
      - name: Start synthetic-data return-path listener
        run: |
          bind_ip="$(tailscale ip -4)"
          python3 probe.py serve --bind "$bind_ip" --port 42071 --seconds 600 > "$RUNNER_TEMP/probe-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/probe-server.pid"
          sleep 1
          kill -0 "$(cat "$RUNNER_TEMP/probe-server.pid")"
          echo 'Temporary return-path listener ready'
      - name: Measure overseas-initiated path into China
        id: outbound
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os,subprocess,re,json
          r=subprocess.run(['tailscale','ping','--timeout=5s','--c=4',os.environ['TARGET_TS_IP']],capture_output=True,text=True,timeout=30)
          rows=[]
          for line in (r.stdout+r.stderr).splitlines():
              sample=re.search(r'in ([0-9.]+)ms',line)
              if sample:rows.append({'path':'DERP' if 'via DERP(' in line else 'peer-relay' if 'peer-relay' in line else 'direct','latency_ms':float(sample[1])})
          print(json.dumps({'tailscale_ping_exit':r.returncode,'samples':rows}))
          PY
          python3 probe.py measure --target "$TARGET_TS_IP" --port 42070 --rounds 3 --delay 10 --ssh-banner --label overseas-to-China
      - name: Allow China-initiated return-path measurements
        if: ${{ always() && steps.join.outcome == 'success' }}
        run: |
          echo 'Waiting 150 seconds for the independently initiated return-path probe'
          sleep 150
      - name: Stop temporary listener
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/probe-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/probe-server.pid")" 2>/dev/null || true
          fi
      - name: Remove temporary Tailscale device
        if: always()
        run: sudo /usr/local/bin/tailscale logout || true
      - name: Report outbound test result
        if: always()
        env:
          OUTCOME: ${{ steps.outbound.outcome }}
        run: test "$OUTCOME" = success
