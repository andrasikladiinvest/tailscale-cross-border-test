name: Cross-border Tailscale qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-border-qualification
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_TS_IP: ${{ secrets.TARGET_TS_IP }}
      PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
      SSH_TEST_PUBLIC_KEY: ${{ secrets.SSH_TEST_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify overseas runner and required inputs
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          test -n "$AUTHKEY" && test -n "$TARGET_TS_IP" && test -n "$PROBE_TOKEN"
          python3 - <<'PY'
          import urllib.request,json,re
          with urllib.request.urlopen('https://www.cloudflare.com/cdn-cgi/trace',timeout=15) as r:
              text=r.read(8192).decode()
          country=re.search(r'^loc=([A-Z]{2})$',text,re.M)
          assert country and country[1]!='CN','Runner country not verified outside mainland China'
          print(json.dumps({'runner_country':country[1],'outside_mainland_china':True}))
          PY
      - name: Join as a temporary Tailscale device
        id: join
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 https://pkgs.tailscale.com/stable/tailscale_1.104.4_amd64.tgz -o "$RUNNER_TEMP/tailscale.tgz"
          curl --fail --silent --show-error --max-time 15 https://pkgs.tailscale.com/stable/tailscale_1.104.4_amd64.tgz.sha256 -o "$RUNNER_TEMP/tailscale.sha256"
          expected="$(awk '{print $1}' "$RUNNER_TEMP/tailscale.sha256")"
          echo "$expected  $RUNNER_TEMP/tailscale.tgz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/tailscale.tgz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/tailscale_1.104.4_amd64/tailscale" /usr/local/bin/tailscale
          sudo install -m 755 "$RUNNER_TEMP/tailscale_1.104.4_amd64/tailscaled" /usr/local/bin/tailscaled
          sudo /usr/local/bin/tailscaled --state=mem: > "$RUNNER_TEMP/tailscaled.log" 2>&1 &
          sleep 2
          python3 - <<'PYAUTH'
          import os,re,subprocess,json
          key=os.environ['AUTHKEY']
          assert re.fullmatch(r'tskey-auth-[A-Za-z0-9_-]+',key),'Secret must contain a Tailscale Auth key, not an API key'
          code=None;text=''
          try:
              r=subprocess.run(['sudo','/usr/local/bin/tailscale','up','--auth-key='+key,'--hostname=crossborder-'+os.environ['GITHUB_RUN_ID'],'--accept-dns=false','--accept-routes=false','--timeout=15s'],capture_output=True,text=True,timeout=70)
              code=r.returncode;text=r.stdout+r.stderr
          except subprocess.TimeoutExpired:pass
          try:
              q=subprocess.run(['sudo','/usr/local/bin/tailscale','status','--json'],capture_output=True,text=True,timeout=5)
              state=json.loads(q.stdout)
          except Exception:state={}
          if state.get('BackendState')=='NeedsMachineAuth':
              print('Temporary device awaits approval in the Tailscale Machines page',flush=True)
              import time
              end=time.monotonic()+240
              while time.monotonic()<end:
                  time.sleep(3)
                  q=subprocess.run(['sudo','/usr/local/bin/tailscale','status','--json'],capture_output=True,text=True,timeout=5)
                  state=json.loads(q.stdout)
                  if state.get('BackendState')=='Running':code=0;break
          low=text.lower()
          print(json.dumps({'enrollment_exit':code,'backend_state':state.get('BackendState'),'online':state.get('Self',{}).get('Online'),'health_count':len(state.get('Health') or []),'invalid_key_reported':'invalid key' in low or 'invalid auth' in low,'approval_mentioned':'approv' in low,'login_url_present':'https://login.tailscale.com/' in text}))
          assert code==0 and state.get('BackendState')=='Running','Enrollment did not complete; see sanitized state above'
          PYAUTH
      - name: Start tailnet-only synthetic SSH return-path service
        run: |
          test -n "$SSH_TEST_PUBLIC_KEY"
          if ! test -x /usr/sbin/sshd; then sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server; fi
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/test-host-key"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/self-test-key"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_TEST_PUBLIC_KEY" > "$HOME/.ssh/crossborder_authorized_keys"
          cat "$RUNNER_TEMP/self-test-key.pub" >> "$HOME/.ssh/crossborder_authorized_keys"
          chmod 600 "$HOME/.ssh/crossborder_authorized_keys"
          cat > "$RUNNER_TEMP/test-sshd.conf" <<CFG
          Port 22
          ListenAddress $(tailscale ip -4)
          HostKey $RUNNER_TEMP/test-host-key
          PidFile $RUNNER_TEMP/test-sshd.pid
          AuthorizedKeysFile $HOME/.ssh/crossborder_authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          AllowUsers runner
          UsePAM yes
          DisableForwarding yes
          PermitTTY no
          PrintMotd no
          ForceCommand /usr/bin/python3 $GITHUB_WORKSPACE/ssh_payload.py
          CFG
          sudo systemctl stop ssh.service ssh.socket 2>/dev/null || true
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t -f "$RUNNER_TEMP/test-sshd.conf"
          sudo /usr/sbin/sshd -D -f "$RUNNER_TEMP/test-sshd.conf" > "$RUNNER_TEMP/test-sshd.log" 2>&1 &
          sleep 1
          # Prove the listener/account/forced command work before remote measurement.
          printf '%s ' "$(tailscale ip -4)" > "$RUNNER_TEMP/self-known-hosts"
          cat "$RUNNER_TEMP/test-host-key.pub" >> "$RUNNER_TEMP/self-known-hosts"
          reply="$(ssh -q -i "$RUNNER_TEMP/self-test-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/self-known-hosts" -o ConnectTimeout=5 "runner@$(tailscale ip -4)" health)"
          test "$reply" = cross-border-ssh-ok
          echo 'Ephemeral restricted SSH synthetic service passed local self-check'
      - name: Verify overseas-initiated SSH path into China
        id: outbound
        continue-on-error: true
        run: |
          python3 - <<'PYSSH'
          import socket,os,json,time
          for i in range(3):
              start=time.monotonic()
              with socket.create_connection((os.environ['TARGET_TS_IP'],22),timeout=8) as s:
                  banner=s.recv(256)
              ok=banner.startswith(b'SSH-')
              print(json.dumps({'direction':'overseas-to-China','round':i+1,'ssh_banner_passed':ok,'seconds':round(time.monotonic()-start,4)}))
              assert ok
              time.sleep(3)
          PYSSH
      - name: Allow China-initiated return-path measurements
        if: ${{ always() && steps.join.outcome == 'success' }}
        run: |
          echo 'Waiting 240 seconds for the independently initiated return-path probe'
          sleep 240
      - name: Stop temporary SSH listener
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/test-sshd.pid"; then sudo kill "$(cat "$RUNNER_TEMP/test-sshd.pid")" || true; fi
      - name: Remove temporary Tailscale device
        if: always()
        run: sudo /usr/local/bin/tailscale logout || true
      - name: Report outbound test result
        if: always()
        env:
          OUTCOME: ${{ steps.outbound.outcome }}
        run: test "$OUTCOME" = success
